name: cobrapp_supabase
publish_to: 'none'
description: Reconstrução do CobrApp/PrestApp com Supabase.
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.0
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  font_awesome_flutter: ^10.9.1
  flutter_local_notifications: ^18.0.1
  hive_flutter: ^1.1.0
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
