name: Build CobrApp APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build CobrApp
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Configurar Android SDK 36
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"

      - name: Configurar assinatura fixa
        env:
          KEYSTORE_BASE64: ${{ secrets.COBRAPP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.COBRAPP_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COBRAPP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COBRAPP_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERRO: assinatura fixa não configurada nos GitHub Actions Secrets."
            echo "Necessários: COBRAPP_KEYSTORE_BASE64, COBRAPP_STORE_PASSWORD, COBRAPP_KEY_ALIAS e COBRAPP_KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Limpar projeto
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar remoção do file_picker
        run: |
          if flutter pub deps --style=compact | grep -q "file_picker"; then
            echo "ERRO: file_picker ainda está presente nas dependências."
            exit 1
          fi
          echo "OK: file_picker não está presente."

      - name: Analisar projeto
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testar projeto
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - name: Verificar APK
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CobrApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
