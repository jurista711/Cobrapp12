name: Build CobrApp APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build CobrApp
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Corrigir navegação Roots e visual da calculadora
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('lib/main.dart')
          s = main.read_text()

          old_switch = """      case 8: return const ReportsPage();
      case 9: return const CalculatorPage();
      case 10: return const SettingsPage();"""
          new_switch = """      case 8: return const ReportsPage();
      case 9: return const PortfolioPage();
      case 10: return const CalculatorPage();
      case 11: return const SettingsPage();"""
          if old_switch in s:
              s = s.replace(old_switch, new_switch, 1)

          calc_dest = """          NavigationDrawerDestination(icon:Icon(Icons.calculate_outlined),selectedIcon:Icon(Icons.calculate),label:Text('Calculadora')),"""
          portfolio_dest = """          NavigationDrawerDestination(icon:Icon(Icons.account_balance_outlined),selectedIcon:Icon(Icons.account_balance),label:Text('Gestão da Carteira')),"""
          if portfolio_dest not in s and calc_dest in s:
              s = s.replace(calc_dest, portfolio_dest + "\n" + calc_dest, 1)

          main.write_text(s)

          calc = Path('lib/calculator_page.dart')
          c = calc.read_text()

          old_form = """        Card(
          child: Padding(
            padding: const EdgeInsets.all(16),"""
          new_form = """        Card(
          elevation: 0,
          color: const Color(0xFFF4EEFF),
          shape: RoundedRectangleBorder(
            borderRadius: BorderRadius.circular(24),
            side: const BorderSide(color: Color(0xFFE1D2FF)),
          ),
          child: Padding(
            padding: const EdgeInsets.all(18),"""
          if old_form in c:
              c = c.replace(old_form, new_form, 1)

          old_result = """    return Card(
      child: Padding(
        padding: const EdgeInsets.all(16),"""
          new_result = """    return Card(
      elevation: 0,
      color: color.withValues(alpha: 0.08),
      shape: RoundedRectangleBorder(
        borderRadius: BorderRadius.circular(22),
        side: BorderSide(color: color.withValues(alpha: 0.22)),
      ),
      child: Padding(
        padding: const EdgeInsets.all(16),"""
          if old_result in c:
              c = c.replace(old_result, new_result, 1)

          calc.write_text(c)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/calculator_page.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix: corrigir navegação do menu e visual da calculadora [navigation-fix]"
            git push
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Configurar Android SDK 36
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"

      - name: Limpar projeto
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar remoção do file_picker
        run: |
          if flutter pub deps --style=compact | grep -q "file_picker"; then
            echo "ERRO: file_picker ainda está presente nas dependências."
            exit 1
          fi
          echo "OK: file_picker não está presente."

      - name: Analisar projeto
        run: flutter analyze --no-fatal-infos

      - name: Testar projeto
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - name: Verificar APK
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CobrApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
