name: Patch navigation
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python3 scripts/modernize_visual.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/main.dart lib/calculator_page.dart
          if ! git diff --cached --quiet; then
            git commit -m "feat: modernizar identidade visual Roots Cobrança [modern-ui]"
            git push
          fi
