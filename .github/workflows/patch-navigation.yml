name: Patch navigation
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace("case 9: return const CalculatorPage();\n      case 10: return const SettingsPage();", "case 9: return const PortfolioPage();\n      case 10: return const CalculatorPage();\n      case 11: return const SettingsPage();", 1)
          calc = "          NavigationDrawerDestination(icon:Icon(Icons.calculate_outlined),selectedIcon:Icon(Icons.calculate),label:Text('Calculadora'))," 
          port = "          NavigationDrawerDestination(icon:Icon(Icons.account_balance_outlined),selectedIcon:Icon(Icons.account_balance),label:Text('Gestão da Carteira'))," 
          if port not in s and calc in s:
              s = s.replace(calc, port + "\n" + calc, 1)
          p.write_text(s)

          cpath = Path('lib/calculator_page.dart')
          c = cpath.read_text()
          c = c.replace("        Card(\n          child: Padding(\n            padding: const EdgeInsets.all(16),", "        Card(\n          elevation: 0,\n          color: const Color(0xFFF4EEFF),\n          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(24), side: const BorderSide(color: Color(0xFFE1D2FF))),\n          child: Padding(\n            padding: const EdgeInsets.all(18),", 1)
          cpath.write_text(c)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/main.dart lib/calculator_page.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix: corrigir navegação e calculadora [navigation-fix]"
            git push
          fi
