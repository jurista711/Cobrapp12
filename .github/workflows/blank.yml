name: CobrApp Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Configurar Android SDK 36
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Instalar dependências
        run: flutter pub get

      - name: Forçar compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          # Corrige o app
          app = Path("android/app/build.gradle.kts")

          if app.exists():
              text = app.read_text()

              text = re.sub(
                  r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                  'compileSdk = 36',
                  text
              )

              text = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 36',
                  text
              )

              if "isCoreLibraryDesugaringEnabled = true" not in text:
                  text = text.replace(
                      "targetCompatibility = JavaVersion.VERSION_17",
                      "targetCompatibility = JavaVersion.VERSION_17\n"
                      "        isCoreLibraryDesugaringEnabled = true",
                      1
                  )

              dependency = (
                  'coreLibraryDesugaring('
                  '"com.android.tools:desugar_jdk_libs:2.1.5")'
              )

              if dependency not in text:
                  text = text.replace(
                      "kotlin {",
                      'dependencies {\n'
                      '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n'
                      '}\n\n'
                      'kotlin {',
                      1
                  )

              app.write_text(text)

          # Corrige os plugins Flutter baixados pelo pub.
          count = 0

          if root.exists():
              for gradle in root.glob("*/android/build.gradle*"):
                  try:
                      text = gradle.read_text()

                      new_text = re.sub(
                          r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                          'compileSdk = 36',
                          text
                      )

                      new_text = re.sub(
                          r'compileSdk\s*=\s*\d+',
                          'compileSdk = 36',
                          new_text
                      )

                      if new_text != text:
                          gradle.write_text(new_text)
                          count += 1
                          print(f"Corrigido: {gradle}")

                  except Exception:
                      pass

          print("====================================")
          print("APP COMPILE SDK: 36")
          print(f"PLUGINS CORRIGIDOS: {count}")
          print("DESUGARING: CONFIGURADO")
          print("====================================")
          PY

      - name: Conferir configurações
        run: |
          echo "=== APP ==="
          grep -R "compileSdk" android/app/build.gradle.kts || true

          echo "=== PLUGINS ==="
          grep -R "compileSdk" "$HOME/.pub-cache/hosted/pub.dev/flutter_plugin_android_lifecycle"*"/android/" 2>/dev/null || true

      - name: Analisar projeto
        run: flutter analyze --no-fatal-infos || true

      - name: Gerar APK
        run: flutter build apk --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CobrApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30