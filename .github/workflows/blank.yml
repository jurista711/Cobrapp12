name: CobrApp Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Configurar Android SDK 36
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Instalar dependências
        run: flutter pub get

      - name: Forçar compileSdk 36 no app e nos plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Corrige o arquivo principal do app
          for gradle in Path("android/app").glob("build.gradle*"):
              text = gradle.read_text()
              text = re.sub(r'compileSdk\s*[= ]*\d+', 'compileSdk = 36', text)
              text = re.sub(r'compileSdkVersion\s*[= ]*\d+', 'compileSdkVersion = 36', text)
              gradle.write_text(text)
              print(f"✅ Corrigido: {gradle}")

          # Corrige todos os plugins baixados
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          if root.exists():
              for gradle in root.glob("*/android/**/*.gradle*"):
                  try:
                      text = gradle.read_text()
                      new_text = re.sub(r'compileSdk\s*[= ]*\d+', 'compileSdk = 36', text)
                      new_text = re.sub(r'compileSdkVersion\s*[= ]*\d+', 'compileSdkVersion = 36', new_text)
                      if new_text != text:
                          gradle.write_text(new_text)
                          print(f"✅ Plugin corrigido: {gradle}")
                  except:
                      pass
          print("✅ TODOS os arquivos configurados com compileSdk = 36")
          PY

      - name: Analisar projeto
        run: flutter analyze --no-fatal-infos || true

      - name: Gerar APK
        run: flutter build apk --release

      - name: Salvar APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: CobrApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
