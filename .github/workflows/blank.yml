name: CobrApp Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐦 Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: 📱 Instalar Android SDK 36
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: 📦 Instalar dependências
        run: flutter pub get

      - name: 🔧 Aplicar correções — compileSdk 36 + Desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # === CORRIGE O ARQUIVO PRINCIPAL ===
          gradle = Path("android/app/build.gradle")
          if gradle.exists():
              txt = gradle.read_text()

              # Muda compileSdk para 36
              txt = re.sub(r'compileSdk\s*\d+', 'compileSdk 36', txt)
              txt = re.sub(r'compileSdkVersion\s*\d+', 'compileSdkVersion 36', txt)

              # Adiciona Desugaring se não existir
              if "coreLibraryDesugaringEnabled" not in txt:
                  txt = re.sub(
                      r'(android\s*\{)',
                      r'''\1
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }''',
                      txt
                  )

              # Adiciona dependência do Desugaring
              if "desugar_jdk_libs" not in txt:
                  txt += '''

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
'''
              gradle.write_text(txt)
              print("✅ android/app/build.gradle → CORRIGIDO")

          # === CORRIGE TODOS OS PLUGINS ===
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          if root.exists():
              for f in root.glob("*/android/**/*.gradle"):
                  try:
                      t = f.read_text()
                      tn = re.sub(r'compileSdk\s*\d+', 'compileSdk 36', t)
                      tn = re.sub(r'compileSdkVersion\s*\d+', 'compileSdkVersion 36', tn)
                      if tn != t:
                          f.write_text(tn)
                          print(f"✅ Plugin corrigido: {f.parent.name}")
                  except:
                      pass
          print("\n🎉 TODAS AS CORREÇÕES APLICADAS!")
          PY

      - name: 🔍 Verificar código
        run: flutter analyze --no-fatal-infos || true

      - name: 🏗️ COMPILAR APK
        run: flutter build apk --release

      - name: 📦 Salvar APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: CobrApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
