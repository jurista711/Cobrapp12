name: CobrApp Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Configurar Android SDK 36
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Corrigir configuração Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "ERRO: android/app/build.gradle.kts não encontrado"
              )

          text = path.read_text()

          text = text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36",
              1
          )

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              marker = "compileOptions {"

              if marker not in text:
                  raise SystemExit(
                      "ERRO: compileOptions não encontrado"
                  )

              start = text.index(marker)
              end = text.index("}", start)

              block = text[start:end]

              block = block.replace(
                  "targetCompatibility = JavaVersion.VERSION_17",
                  "targetCompatibility = JavaVersion.VERSION_17\n"
                  "        isCoreLibraryDesugaringEnabled = true",
                  1
              )

              text = text[:start] + block + text[end:]

          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.5"'
              ')'
          )

          if dependency not in text:
              marker = "kotlin {"

              if marker not in text:
                  raise SystemExit(
                      "ERRO: bloco kotlin não encontrado"
                  )

              text = text.replace(
                  marker,
                  'dependencies {\n'
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n'
                  '}\n\n'
                  'kotlin {',
                  1
              )

          path.write_text(text)

          print("ANDROID SDK 36: OK")
          print("DESUGARING: OK")
          PY

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar projeto
        run: flutter analyze --no-fatal-infos || true

      - name: Gerar APK
        run: flutter build apk --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CobrApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30