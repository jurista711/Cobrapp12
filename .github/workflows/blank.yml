      - name: Corrigir desugaring Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              text = text.replace(
                  "targetCompatibility = JavaVersion.VERSION_17",
                  "targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          if "coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:" not in text:
              text = text.replace(
                  "kotlin {",
                  'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n\nkotlin {',
                  1
              )

          path.write_text(text)
          print("Desugaring configurado com sucesso.")
          PY