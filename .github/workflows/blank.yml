name: CobrApp Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Corrigir desugaring Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("ERRO: android/app/build.gradle.kts não encontrado")

          text = path.read_text()

          # Habilita Core Library Desugaring
          if "isCoreLibraryDesugaringEnabled = true" not in text:
              marker = "compileOptions {"

              if marker not in text:
                  raise SystemExit("ERRO: bloco compileOptions não encontrado")

              start = text.index(marker)
              end = text.index("}", start)

              block = text[start:end]

              if "targetCompatibility" not in block:
                  raise SystemExit(
                      "ERRO: targetCompatibility não encontrado no compileOptions"
                  )

              block = block.replace(
                  "targetCompatibility = JavaVersion.VERSION_17",
                  "targetCompatibility = JavaVersion.VERSION_17\n"
                  "        isCoreLibraryDesugaringEnabled = true",
                  1
              )

              text = text[:start] + block + text[end:]

          # Adiciona a biblioteca necessária
          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.5"'
              ')'
          )

          if dependency not in text:
              marker = "kotlin {"

              if marker not in text:
                  raise SystemExit("ERRO: bloco kotlin não encontrado")

              text = text.replace(
                  marker,
                  'dependencies {\n'
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n'
                  '}\n\n'
                  'kotlin {',
                  1
              )

          path.write_text(text)

          print("====================================")
          print("DESUGARING CONFIGURADO COM SUCESSO")
          print("====================================")
          PY

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar projeto
        run: flutter analyze --no-fatal-infos || true

      - name: Gerar APK
        run: flutter build apk --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CobrApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30