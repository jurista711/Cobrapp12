name: CobrApp Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

            - name: Corrigir desugaring Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              text = text.replace(
                  "targetCompatibility = JavaVersion.VERSION_17",
                  "targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          if "coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:" not in text:
              text = text.replace(
                  "kotlin {",
                  'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n\nkotlin {',
                  1
              )

          path.write_text(text)
          print("Desugaring configurado com sucesso.")
          PY

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar projeto
        run: flutter analyze --no-fatal-infos || true

      - name: Gerar APK
        run: flutter build apk --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CobrApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30