name: CobrApp Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Configurar Android SDK 36
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Forçar compileSdk 36 e desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("ERRO: build.gradle.kts não encontrado")

          text = path.read_text()

          # Força qualquer configuração compileSdk para 36.
          text = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 36',
              text
          )

          # Garante desugaring.
          if "isCoreLibraryDesugaringEnabled = true" not in text:
              text = text.replace(
                  "targetCompatibility = JavaVersion.VERSION_17",
                  "targetCompatibility = JavaVersion.VERSION_17\n"
                  "        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          dependency = (
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          )

          if dependency not in text:
              text = text.replace(
                  "kotlin {",
                  'dependencies {\n'
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n'
                  '}\n\n'
                  'kotlin {',
                  1
              )

          path.write_text(text)

          print("compileSdk configurado para 36")
          print("desugaring configurado")
          PY

      - name: Conferir compileSdk
        run: |
          echo "=== compileSdk encontrado ==="
          grep -n "compileSdk" android/app/build.gradle.kts
          echo "============================="

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar projeto
        run: flutter analyze --no-fatal-infos || true

      - name: Gerar APK
        run: flutter build apk --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CobrApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30